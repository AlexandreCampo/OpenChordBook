MaintainerNotes: |-
  All UI assets are local. Native additions include catalog-bound downloads,
  file selection, immersive reading and Android Back handling; the offline
  editor and library work without any network service or iReal Pro installation.
  No tunes are bundled. Optional external repertoire downloads are disclosed
  under NonFreeNet; please review the catalog for any additional labels.
  Third-party notices and font provenance are in THIRD_PARTY_NOTICES.md.
  Development includes AI-assisted code; see CONTRIBUTING.md.
  AGP 9.4.1 / Gradle 9.7.1 / Java 17 bytecode / SDK 36. Verify the buildserver
  toolchain before merging. No private signing material is needed.

