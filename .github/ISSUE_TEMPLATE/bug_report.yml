name: Bug report
description: Report a reproducible problem with the reader, editor or library
body:
  - type: markdown
    attributes:
      value: "Describe what happened and how to reproduce it. A small practice chart can help."
  - type: input
    id: environment
    attributes:
      label: App and device
      description: App version, Android/WebView or browser version, and device
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small synthetic chart if chart content is needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
